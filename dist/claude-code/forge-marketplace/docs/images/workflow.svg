<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 590" width="1250" height="590" font-family="-apple-system, 'Sukhumvit Set', 'Noto Sans Thai', 'Segoe UI', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="1250" height="590" rx="18" fill="#ffffff"/>
  <text x="625" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Forge workflow — 3 Gates · คุณอนุมัติ 2 จุด</text>

  <!-- read-only bracket over plan + approval -->
  <path d="M24 66 V58 H481 V66" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="252" y="52" text-anchor="middle" font-size="13" fill="#475569">🔒 ก่อนอนุมัติ: อ่านอย่างเดียว — แก้ได้แค่ไฟล์แผน</text>

  <!-- gates -->
  <g font-size="12">
    <rect x="20" y="78" width="220" height="128" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="130" y="100" text-anchor="middle" fill="#1d4ed8" font-weight="700">GATE 1/3 · PLAN</text>
    <text x="130" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Plan</text>
    <text x="130" y="144" text-anchor="middle" fill="#334155">main agent สำรวจเองแล้วเขียนแผน</text>
    <text x="130" y="170" text-anchor="middle" fill="#1d4ed8">Context · Approach · Verification</text>
    <text x="130" y="187" text-anchor="middle" fill="#1d4ed8">+ BIZ · REQ · TC · QG ตรวจก่อนส่ง</text>

    <rect x="265" y="78" width="220" height="128" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="375" y="100" text-anchor="middle" fill="#b45309" font-weight="700">คุณ · จุดที่ 1</text>
    <text x="375" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Approval</text>
    <text x="375" y="144" text-anchor="middle" fill="#334155">คุณอนุมัติแผนเองใน dialog</text>
    <text x="375" y="170" text-anchor="middle" fill="#b45309">keep · compact · refine · not now</text>
    <text x="375" y="187" text-anchor="middle" fill="#b45309">AI อนุมัติแทนไม่ได้</text>

    <rect x="510" y="78" width="220" height="128" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="620" y="100" text-anchor="middle" fill="#15803d" font-weight="700">GATE 2/3 · EXECUTE</text>
    <text x="620" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Execute</text>
    <text x="620" y="144" text-anchor="middle" fill="#334155">main agent ลงมือทำตามแผนเอง</text>
    <text x="620" y="170" text-anchor="middle" fill="#15803d">todo ต่อขั้น · ตรวจทุกขั้น</text>
    <text x="620" y="187" text-anchor="middle" fill="#15803d">นอกขอบเขต → หยุดแล้วขอแผนใหม่</text>

    <rect x="755" y="78" width="220" height="128" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="865" y="100" text-anchor="middle" fill="#7e22ce" font-weight="700">GATE 3/3 · QA</text>
    <text x="865" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">QA</text>
    <text x="865" y="144" text-anchor="middle" fill="#334155">รัน check + reviewer พร้อมกัน</text>
    <text x="865" y="170" text-anchor="middle" fill="#7e22ce">ทุก TC ต้องมีหลักฐาน</text>
    <text x="865" y="187" text-anchor="middle" fill="#7e22ce">แสดงตารางสรุป ✅ ❌ ⚠️ ⏸️</text>

    <rect x="1000" y="78" width="220" height="128" rx="12" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="1110" y="100" text-anchor="middle" fill="#0f766e" font-weight="700">หลัง QA PASS</text>
    <text x="1110" y="124" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">Delivery</text>
    <text x="1110" y="144" text-anchor="middle" fill="#334155">สรุปงาน + commit message</text>
    <text x="1110" y="170" text-anchor="middle" fill="#0f766e">คุณ commit เอง</text>
    <text x="1110" y="187" text-anchor="middle" fill="#0f766e">Forge ไม่แตะ Git</text>
  </g>

  <!-- arrows between gates -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="241" y1="142" x2="263" y2="142"/>
    <line x1="486" y1="142" x2="508" y2="142"/>
    <line x1="731" y1="142" x2="753" y2="142"/>
    <line x1="976" y1="142" x2="998" y2="142"/>
  </g>

  <!-- who works in each gate -->
  <g font-size="13" font-family="ui-monospace, Menlo, monospace">
    <rect x="35" y="226" width="190" height="28" rx="14" fill="#dbeafe"/><text x="130" y="245" text-anchor="middle" fill="#1e3a8a">main agent + scout</text>
    <rect x="35" y="260" width="190" height="28" rx="14" fill="#ffffff" stroke="#3b82f6" stroke-dasharray="5 4"/><text x="130" y="279" text-anchor="middle" fill="#1e3a8a" font-size="12">forge-plan-critic <tspan font-family="-apple-system, 'Sukhumvit Set', sans-serif">(ถ้าเปิด)</tspan></text>

    <rect x="280" y="226" width="190" height="28" rx="14" fill="#fde68a"/><text x="375" y="245" text-anchor="middle" fill="#78350f" font-family="-apple-system, 'Sukhumvit Set', sans-serif">👤 คุณ (มนุษย์)</text>

    <rect x="525" y="226" width="190" height="28" rx="14" fill="#bbf7d0"/><text x="620" y="245" text-anchor="middle" fill="#14532d">main agent</text>

    <rect x="770" y="226" width="190" height="28" rx="14" fill="#e9d5ff"/><text x="865" y="245" text-anchor="middle" fill="#581c87">main agent</text>
    <rect x="770" y="260" width="190" height="28" rx="14" fill="#e9d5ff"/><text x="865" y="279" text-anchor="middle" fill="#581c87">forge-code-reviewer</text>

    <rect x="1015" y="226" width="190" height="28" rx="14" fill="#99f6e4"/><text x="1110" y="245" text-anchor="middle" fill="#134e4a">main agent</text>
  </g>

  <!-- QA FAIL / BLOCKED: your decision, then a fix plan that needs approval again -->
  <path d="M865 290 V408 H234 V210" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#r)"/>
  <rect x="330" y="366" width="440" height="84" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text x="550" y="390" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">QA FAIL / BLOCKED → คุณเลือกเอง · จุดที่ 2</text>
  <text x="550" y="412" text-anchor="middle" font-size="12" fill="#7f1d1d">วางแผนแก้ · วางแผนแก้ + โน้ต · รัน QA ใหม่ (BLOCKED) · ยังไม่ทำ</text>
  <text x="550" y="434" text-anchor="middle" font-size="12" fill="#7f1d1d">แผนแก้ต้องผ่าน Approval อีกครั้งก่อนแก้โค้ด</text>

  <!-- footer -->
  <rect x="20" y="474" width="1210" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="500" font-size="14" font-weight="700" fill="#0f172a">กฎที่ใช้ทุก Gate</text>
  <text x="40" y="523" font-size="13" fill="#334155">• agent ห้ามรัน git add/commit/push/tag/merge และห้าม publish repo   • agent ของ Forge (reviewer · critic) อ่านอย่างเดียว ไม่มี shell</text>
  <text x="40" y="545" font-size="13" fill="#334155">• แผนต้องมี Open decisions (ทุกข้อมี default) และ Migration &amp; rollback   • finding CRITICAL/HIGH ของ reviewer ต้องอยู่ในรายงาน QA</text>
  <text x="40" y="567" font-size="13" fill="#334155">• ห้ามสร้างหลักฐานเอง: test ที่ไม่ได้รันจริงต้องเป็น NOT_RUN</text>
</svg>
