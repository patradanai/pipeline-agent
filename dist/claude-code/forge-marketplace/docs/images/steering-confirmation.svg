<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">OMP Forge prompt steering confirmation</title>
  <desc id="desc">When a user types a prompt during a Forge workflow, OMP asks whether to steer the workflow into a new gate or cancel and continue current work.</desc>
  <defs><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}.muted{fill:#64748b}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}</style></defs>
  <rect x="18" y="18" width="884" height="384" rx="22" fill="#f1f5f9" stroke="#dbe3ed"/>
  <rect x="154" y="50" width="612" height="318" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="190" cy="86" r="7" fill="#f87171"/><circle cx="214" cy="86" r="7" fill="#fbbf24"/><circle cx="238" cy="86" r="7" fill="#4ade80"/>
  <text x="460" y="91" text-anchor="middle" font-size="14" font-weight="650" class="muted">OMP · MAIN SESSION</text>
  <text x="198" y="142" font-size="22" font-weight="750">Forge steering</text>
  <text x="198" y="173" font-size="15" class="muted">Prompt from user:</text>
  <rect x="198" y="188" width="524" height="47" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="216" y="217" font-size="15" class="mono">“Add CSV export for bookings”</text>
  <rect x="198" y="259" width="524" height="51" rx="10" fill="#eaf2ff" stroke="#3b73d1" stroke-width="2"/>
  <text x="216" y="281" font-size="15" font-weight="700" fill="#2859a8">Steer · QA → PLAN</text>
  <text x="216" y="299" font-size="12" class="muted">Revoke approval · re-plan · approve again</text>
  <rect x="198" y="321" width="524" height="34" rx="9" fill="#fff" stroke="#cbd5e1"/>
  <text x="216" y="343" font-size="14" font-weight="650">Cancel · keep working on QA</text>
</svg>
