<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Forge human-approved AI coding workflow</title>
  <desc id="desc">Three gates: the main agent plans in Forge plan mode, you approve the plan, the main agent executes it, then QA runs checks with one independent code reviewer and shows a summary table. Delivery follows QA PASS. After QA FAIL or BLOCKED you decide whether to plan a fix, and the fix plan needs approval again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
    <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c2410c"/></marker>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}
      .sub{font-size:13px;fill:#475569}.stage{font-size:18px;font-weight:700}.gate{font-size:11px;font-weight:700;letter-spacing:1.2px}
      .pill{font-size:12px;font-weight:650}
    </style>
  </defs>
  <rect x="20" y="20" width="1160" height="370" rx="24" fill="#f8fafc" stroke="#dbe3ed"/>
  <text x="600" y="58" text-anchor="middle" font-size="25" font-weight="750">A human-approved path from request to delivery</text>
  <g text-anchor="middle">
    <g transform="translate(36 100)"><rect width="196" height="124" rx="15" fill="#eaf2ff" stroke="#3b73d1" stroke-width="2"/><text x="98" y="25" class="gate" fill="#2859a8">GATE 1/3 · PLAN</text><text x="98" y="55" class="stage">Plan</text><text x="98" y="82" class="sub">Main agent explores and</text><text x="98" y="101" class="sub">writes a checked plan</text></g>
    <g transform="translate(264 100)"><rect width="196" height="124" rx="15" fill="#fff5d9" stroke="#d49a1d" stroke-width="2.5"/><text x="98" y="25" class="gate" fill="#9a6810">YOU</text><text x="98" y="55" class="stage">Approval</text><text x="98" y="82" class="sub">You review and approve</text><text x="98" y="101" class="sub">in Forge's dialog</text></g>
    <g transform="translate(492 100)"><rect width="196" height="124" rx="15" fill="#e8f7ed" stroke="#37935b" stroke-width="2"/><text x="98" y="25" class="gate" fill="#287346">GATE 2/3 · EXECUTE</text><text x="98" y="55" class="stage">Execute</text><text x="98" y="82" class="sub">Main agent implements</text><text x="98" y="101" class="sub">the approved scope only</text></g>
    <g transform="translate(720 100)"><rect width="196" height="124" rx="15" fill="#f3eafa" stroke="#9360ad" stroke-width="2"/><text x="98" y="25" class="gate" fill="#75428d">GATE 3/3 · QA</text><text x="98" y="55" class="stage">QA</text><text x="98" y="82" class="sub">Checks + independent</text><text x="98" y="101" class="sub">reviewer · summary table</text></g>
    <g transform="translate(948 100)"><rect width="196" height="124" rx="15" fill="#e1f5f2" stroke="#23877b" stroke-width="2"/><text x="98" y="25" class="gate" fill="#176e64">AFTER QA PASS</text><text x="98" y="55" class="stage">Delivery</text><text x="98" y="82" class="sub">Commit message ready;</text><text x="98" y="101" class="sub">you commit manually</text></g>
  </g>
  <g stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"><path d="M234 162h26"/><path d="M462 162h26"/><path d="M690 162h26"/><path d="M918 162h26"/></g>
  <rect x="44" y="234" width="136" height="26" rx="13" fill="#fff" stroke="#3b73d1" stroke-dasharray="5 4"/>
  <text x="112" y="252" text-anchor="middle" class="pill" fill="#2859a8">+ optional critic</text>
  <path d="M818 226v80H206v-78" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#return)"/>
  <rect x="270" y="289" width="460" height="34" rx="17" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="500" y="311" text-anchor="middle" font-size="13" font-weight="650" fill="#9a3412">QA FAIL / BLOCKED → you decide: plan a fix, rerun QA, or wait</text>
  <text x="600" y="360" text-anchor="middle" font-size="13" fill="#475569">Every fix plan needs fresh human approval · Forge never commits or publishes for you</text>
</svg>
