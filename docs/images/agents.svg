<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 450" width="1250" height="450" font-family="-apple-system, 'Sukhumvit Set', 'Noto Sans Thai', 'Segoe UI', sans-serif">
<rect width="1250" height="450" rx="18" fill="#ffffff"/>
