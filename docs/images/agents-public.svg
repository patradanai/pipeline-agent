<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Forge specialist agents and permissions</title>
  <desc id="desc">Six agents cover requirement analysis, planning, execution, independent QA, code review, and delivery. Only the executor can edit project files, and it has no shell.</desc>
  <defs><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#172033}.name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;font-weight:700}.role{font-size:14px}.detail{font-size:12px;fill:#475569}.tag{font-size:11px;font-weight:650}</style></defs>
  <rect x="16" y="16" width="1088" height="388" rx="22" fill="#f8fafc" stroke="#dbe3ed"/>
  <text x="560" y="53" text-anchor="middle" font-size="23" font-weight="750">Six specialists · one human-controlled workflow</text>
  <g>
    <g transform="translate(36 83)"><rect width="330" height="130" rx="14" fill="#fff" stroke="#3b73d1" stroke-width="2"/><text x="20" y="33" class="name">forge-requirement</text><text x="20" y="62" class="role">Requirement analyst</text><text x="20" y="84" class="detail">Scope · gaps · risks · architecture · QA strategy</text><rect x="20" y="99" width="82" height="20" rx="10" fill="#eaf2ff"/><text x="61" y="113" text-anchor="middle" class="tag">READ-ONLY</text></g>
    <g transform="translate(395 83)"><rect width="330" height="130" rx="14" fill="#fff" stroke="#3b73d1" stroke-width="2"/><text x="20" y="33" class="name">forge-planner</text><text x="20" y="62" class="role">Technical planner</text><text x="20" y="84" class="detail">Tasks · dependencies · test matrix · rollback</text><rect x="20" y="99" width="82" height="20" rx="10" fill="#eaf2ff"/><text x="61" y="113" text-anchor="middle" class="tag">READ-ONLY</text></g>
    <g transform="translate(754 83)"><rect width="330" height="130" rx="14" fill="#fff" stroke="#37935b" stroke-width="2"/><text x="20" y="33" class="name">forge-executor</text><text x="20" y="62" class="role">Approved implementation</text><text x="20" y="84" class="detail">Writes project files within approved scope</text><rect x="20" y="99" width="125" height="20" rx="10" fill="#e8f7ed"/><text x="82" y="113" text-anchor="middle" class="tag">EDIT · NO SHELL</text></g>
    <g transform="translate(36 236)"><rect width="330" height="130" rx="14" fill="#fff" stroke="#9360ad" stroke-width="2"/><text x="20" y="33" class="name">forge-qa</text><text x="20" y="62" class="role">Business QA</text><text x="20" y="84" class="detail">Checks every approved test case against evidence</text><rect x="20" y="99" width="82" height="20" rx="10" fill="#f3eafa"/><text x="61" y="113" text-anchor="middle" class="tag">READ-ONLY</text></g>
    <g transform="translate(395 236)"><rect width="330" height="130" rx="14" fill="#fff" stroke="#9360ad" stroke-width="2"/><text x="20" y="33" class="name">forge-code-reviewer</text><text x="20" y="62" class="role">Independent code reviewer</text><text x="20" y="84" class="detail">Correctness · security · maintainability · evidence</text><rect x="20" y="99" width="82" height="20" rx="10" fill="#f3eafa"/><text x="61" y="113" text-anchor="middle" class="tag">READ-ONLY</text></g>
    <g transform="translate(754 236)"><rect width="330" height="130" rx="14" fill="#fff" stroke="#23877b" stroke-width="2"/><text x="20" y="33" class="name">forge-delivery</text><text x="20" y="62" class="role">Delivery writer</text><text x="20" y="84" class="detail">Release notes · rollout · rollback · commit draft</text><rect x="20" y="99" width="82" height="20" rx="10" fill="#e1f5f2"/><text x="61" y="113" text-anchor="middle" class="tag">READ-ONLY</text></g>
  </g>
</svg>
