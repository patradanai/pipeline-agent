<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, sans-serif" fill="currentColor">
  <title id="title">Forge responsibilities and permissions</title>
  <desc id="desc">The main agent plans, implements after approval, verifies and delivers. A read-only code reviewer works during QA. An optional read-only plan critic works before proposal. Humans approve plans and decide after QA failure or blocked evidence.</desc>
  <text x="500" y="36" text-anchor="middle" font-size="23" font-weight="700">Main agent owns the work · specialists review</text>
  <g transform="translate(20 70)">
    <rect width="310" height="220" rx="14" fill="none" stroke="currentColor"/>
    <text x="18" y="32" font-size="18" font-weight="700">Main agent</text>
    <text x="18" y="62" font-size="14">Plan · implement · verify · deliver</text>
    <text x="18" y="92" font-size="14">Explore with read-only research:</text>
    <text x="18" y="114" font-size="14">scout (OMP) / Explore (Claude Code)</text>
    <text x="18" y="146" font-size="14">Project edits only after approval.</text>
    <text x="18" y="168" font-size="14">Run checks; report observed evidence.</text>
    <text x="18" y="200" font-size="13" font-weight="700">NO GIT WRITES · NO SELF-APPROVAL</text>
  </g>
  <g transform="translate(345 70)">
    <rect width="310" height="220" rx="14" fill="none" stroke="currentColor"/>
    <text x="18" y="32" font-size="18" font-weight="700">forge-code-reviewer</text>
    <text x="18" y="62" font-size="14">QA · independent diff review</text>
    <text x="18" y="92" font-size="14">Changed files and direct callers only.</text>
    <text x="18" y="114" font-size="14">Correctness · security · maintainability</text>
    <text x="18" y="146" font-size="14">CR-001 [HIGH] file:line — evidence</text>
    <text x="18" y="168" font-size="14">Every CRITICAL/HIGH ID stays in QA.</text>
    <text x="18" y="200" font-size="13" font-weight="700">READ-ONLY · NO SHELL</text>
  </g>
  <g transform="translate(670 70)">
    <rect width="310" height="220" rx="14" fill="none" stroke="currentColor" stroke-dasharray="6 4"/>
    <text x="18" y="32" font-size="18" font-weight="700">forge-plan-critic</text>
    <text x="18" y="62" font-size="14">Optional · before plan approval</text>
    <text x="18" y="92" font-size="14">Review the written plan once.</text>
    <text x="18" y="114" font-size="14">Gaps · decisions · verification</text>
    <text x="18" y="146" font-size="14">Cite every CRITICAL/HIGH PC-id</text>
    <text x="18" y="168" font-size="14">in the plan before proposal.</text>
    <text x="18" y="200" font-size="13" font-weight="700">READ-ONLY · OFF BY DEFAULT</text>
  </g>
  <text x="500" y="330" text-anchor="middle" font-size="15" font-weight="700">You approve plans · you choose what happens after QA FAIL / BLOCKED</text>
  <text x="500" y="358" text-anchor="middle" font-size="14">A fix plan needs fresh approval before code changes. You commit manually after delivery.</text>
</svg>
